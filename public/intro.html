  // Draws the photo with spinning rims; (dx, dy, sc) place it, pitch dips the nose when braking.

      st.addColorStop(0, 'rgba(230,240,255,0)'); st.addColorStop(.5, `rgba(240,246,255,${fa * .8})`); st.addColorStop(1, 'rgba(230,240,255,0)');

      const ga = easeIO(ta), sc2 = 0.94 + 0.06 * ga;

        ctx.fillStyle = bg; ctx.fillRect(bx - R, byy - R, R * 2, R * 2);

      ctx.fillStyle = hl; ctx.fill(pill);
      ctx.strokeStyle = `rgba(255,255,255,${(EMBED ? 0.28 : 0.85) * ga})`; ctx.lineWidth = 1.2; ctx.stroke(pill);

})();
